[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "l200-expense-agent"
version = "1.0.0"
description = "Enterprise Expense & Policy Approval Multi-Agent built with Google ADK, OpenTelemetry, Cloud DLP, Secret Manager, and Terraform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.18.0",
    "google-genai>=1.0.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "python-json-logger>=3.2.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-gcp-trace>=1.8.0",
    "google-cloud-dlp>=3.25.0",
    "google-cloud-secret-manager>=2.21.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
