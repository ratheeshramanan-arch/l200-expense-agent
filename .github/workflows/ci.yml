name: AgentOps CI & Automated Evaluation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-and-eval:
    name: Unit Tests, Secret Scan & ADK Eval
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Static security & hygiene checks (zero hardcoded keys or print statements)
        run: |
          ruff check expense_agent tests
          ! grep -rnE "AIza[0-9A-Za-z_-]{35}|sk-[a-zA-Z0-9]{20,}" expense_agent/ terraform/ evals/
          ! grep -rn "print(" expense_agent/

      - name: Run automated pytest regression & AgentOps suite
        env:
          ALLOW_LOCAL_ENV_FALLBACK: "true"
        run: pytest -v

      - name: Run ADK golden evaluation suite (when GEMINI_API_KEY secret is configured)
        if: ${{ secrets.GEMINI_API_KEY != '' }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALLOW_LOCAL_ENV_FALLBACK: "true"
        run: |
          adk eval expense_agent evals/expense_agent.evalset.json \
            --config_file_path=evals/eval_config.json

  terraform-validate:
    name: Validate Terraform IaC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform format & validate
        working-directory: terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate
